[project]
name = "porkbun-cli"
version = "0.0.1"
requires-python = ">=3.10"
dependencies = [
    "docopt-ng>=0.9.0",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# Make the src/ modules (api, porkbun-cli) importable from tests.
pythonpath = ["src"]
testpaths = ["tests"]
